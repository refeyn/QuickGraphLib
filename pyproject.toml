[project]
name = "QuickGraphLib"
description = "A scientific graphing library for QtQuick"
readme = "README.md"
license = { file = "LICENCE" }
authors = [{ name = "Matthew Joyce", email = "matthew.joyce@refeyn.com" }]
dependencies = ["PySide6==6.11.3", "contourpy", "numpy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Topic :: Multimedia :: Graphics :: Presentation",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: User Interfaces",
    "Typing :: Typed",
]
dynamic = ["version"]
requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/refeyn/QuickGraphLib"
Issues = "https://github.com/refeyn/QuickGraphLib/issues"
Documentation = "https://refeyn.github.io/QuickGraphLib"
Source = "https://github.com/refeyn/QuickGraphLib"

[project.optional-dependencies]
analyse = [
    # Code analysis
    "ruff",
    "mypy",
    "pre-commit",
    "lxml",
    "gersemi",
    # Testing
    "pytest",
    "pytest-cov",
    # Building
    "scikit-build-core",
    "shiboken6_generator==6.11.3",
    "setuptools_scm",
]

[build-system]
requires = ["scikit-build-core", "shiboken6_generator==6.11.3", "PySide6==6.11.3"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"
sdist.include = ["QuickGraphLib/_version.py"]
sdist.exclude = [".github", ".vscode"]
wheel.py-api = "cp310"

[tool.scikit-build.cmake.define]
INSTALL_SUBPATH = "."

[tool.setuptools_scm]
write_to = "QuickGraphLib/_version.py"

[tool.cibuildwheel]
build = [
    "cp310-macosx_x86_64",
    "cp310-win_amd64",
    "cp310-manylinux_x86_64",
    # "cp310-manylinux_aarch64",
]
before-all = "python ci/setup_qt.py"
repair-wheel-command = ""
audit-command = ""
build-frontend = "build"
test-command = "python {project}/ci/fixup_qt.py && pytest -sv {project}/tests --import-mode=append"
test-extras = ["analyse"]

[tool.cibuildwheel.environment]
QT_PATH = "\"$(python ci/find_qt.py)\""
SKBUILD_CMAKE_DEFINE = "CMAKE_PREFIX_PATH=\"$(python ci/find_qt.py)/lib/cmake\""

[tool.cibuildwheel.macos]
archs = ["universal2"]

[tool.cibuildwheel.linux]
archs = ["x86_64"]                                                                                                   # , "aarch64"]
manylinux-x86_64-image = "quay.io/pypa/manylinux_2_34_x86_64"
manylinux-aarch64-image = "quay.io/pypa/manylinux_2_39_aarch64"
repair-wheel-command = "cp {wheel} {dest_dir}; pip install wheel; wheel tags --remove --platform-tag $AUDITWHEEL_PLAT {dest_dir}/*.whl"

[tool.cibuildwheel.linux.environment]
SKBUILD_CMAKE_DEFINE = "CMAKE_PREFIX_PATH=\"$(python ci/find_qt.py)/lib/cmake\""
LD_LIBRARY_PATH = "$LD_LIBRARY_PATH:$(python ci/find_qt.py)/lib"
LLVM_INSTALL_DIR = "/usr"

[tool.cibuildwheel.windows]
archs = ["AMD64"]

[tool.ruff.lint.isort]
combine-as-imports = true
case-sensitive = false

[tool.pylint.main]
extension-pkg-whitelist = ["PySide6"]

[tool.pylint.'messages control']
disable = [
    "R", # R=Refactor
    "C", # C=Conventions
]
